# =============================================================================
# Continuous Integration
#
# Trigger:
#   - Pull request (qualsiasi branch)
#   - Push diretto su main
#
# Job:
#   1. changes: path filter per saltare i job non pertinenti al diff
#   2. Backend (Rails 8): lint (Rubocop), security (Brakeman + bundler-audit),
#      test (Minitest + coverage SimpleCov come artefatto)
#   3. Frontend (Angular 21): test (Vitest + coverage v8 come artefatto)
#   4. e2e: test end-to-end Playwright (backend Rails + frontend Angular avviati
#      nel job, report HTML come artefatto in caso di fallimento)
#   5. docker-build: builda entrambe le immagini come sanity check (NON pubblica)
#   6. ci-success: gate aggregato per le branch protection rules
# =============================================================================

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancella esecuzioni precedenti dello stesso branch/PR per non sprecare runner.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Path filter: stabilisce quali parti del repo sono cambiate
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'Backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'Frontend/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'Backend/Dockerfile'
              - 'Frontend/Dockerfile'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'

  # ---------------------------------------------------------------------------
  # Backend: lint (Rubocop)
  # ---------------------------------------------------------------------------
  backend-lint:
    name: Backend lint (Rubocop)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: Backend
          bundler-cache: true

      - name: Run Rubocop
        run: bin/rubocop -f github

  # ---------------------------------------------------------------------------
  # Backend: security scan (Brakeman SAST + bundler-audit CVE)
  # ---------------------------------------------------------------------------
  backend-security:
    name: Backend security (Brakeman + bundler-audit)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: Backend
          bundler-cache: true

      - name: Brakeman (Rails static analysis)
        run: bin/brakeman --no-pager

      - name: Bundler-audit (vulnerable gems)
        run: bin/bundler-audit check --update

  # ---------------------------------------------------------------------------
  # Backend: test (Minitest)
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend test (Minitest)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: Backend
          bundler-cache: true

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Run Minitest
        run: bin/rails test

      - name: Upload coverage report (SimpleCov)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ github.run_id }}
          path: Backend/coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Frontend: test (Vitest via ng test)
  # ---------------------------------------------------------------------------
  frontend-test:
    name: Frontend test (Vitest)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest (with coverage)
        run: npx ng test --watch=false --coverage

      - name: Upload coverage report (Istanbul)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ github.run_id }}
          path: Frontend/coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # E2E: Playwright su applicazione reale (Rails test env + Angular dev server)
  # Gira dopo i test unitari; salta se uno di essi è fallito.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (Playwright)
    needs: [changes, backend-test, frontend-test]
    if: |
      always()
      && !cancelled()
      && !contains(needs.*.result, 'failure')
      && (needs.changes.outputs.backend == 'true'
          || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # --- Backend ---
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: Backend
          bundler-cache: true

      - name: Prepare and seed test database
        working-directory: Backend
        env:
          RAILS_ENV: test
        run: |
          bin/rails db:test:prepare
          bin/rails db:seed

      - name: Start Rails server (background)
        working-directory: Backend
        env:
          RAILS_ENV: test
        run: |
          bin/rails server -p 3000 -d
          # Attende che Rails risponda sulla porta 3000.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/products > /dev/null; then
              echo "Rails is up"
              break
            fi
            sleep 1
          done

      # --- Frontend ---
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: Frontend
        run: npx playwright install --with-deps chromium

      - name: Start Angular dev server (background)
        working-directory: Frontend
        run: |
          npm start &
          # Attende che Angular risponda sulla porta 4200.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4200 > /dev/null; then
              echo "Angular is up"
              break
            fi
            sleep 2
          done

      # --- Suite E2E ---
      - name: Run Playwright tests
        working-directory: Frontend
        env:
          REUSE_SERVER: '1'   # I server sono già avviati dagli step precedenti
          CI: '1'
        run: npx playwright test

      # --- Report in caso di fallimento ---
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: Frontend/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Docker build: verifica che entrambe le immagini si compilino (NON pubblica)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker images build check
    needs: [changes, backend-test, frontend-test]
    # Gira anche se i cambiamenti sono solo Docker; salta se un test ha fallito.
    if: |
      always()
      && !cancelled()
      && !contains(needs.*.result, 'failure')
      && (needs.changes.outputs.docker == 'true'
          || needs.changes.outputs.backend == 'true'
          || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: false
          tags: shop-backend:ci-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: false
          tags: shop-frontend:ci-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ---------------------------------------------------------------------------
  # Gate finale: aggregato per le branch protection rules
  # ---------------------------------------------------------------------------
  ci-success:
    name: CI success
    needs:
      - backend-lint
      - backend-security
      - backend-test
      - frontend-test
      - e2e
      - docker-build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        run: |
          if echo '${{ toJSON(needs) }}' | grep -q '"result": "failure"'; then
            echo "Almeno un job richiesto è fallito."
            exit 1
          fi
          echo "Tutti i job richiesti sono passati."
