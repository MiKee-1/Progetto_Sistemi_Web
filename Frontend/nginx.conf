server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular is a single-page app: every route that does not match a real
    # file must fall back to index.html, where the Angular router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Build artifacts have a content hash in the filename, so they can be
    # cached forever. index.html keeps the default (no long-lived cache).
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
